name: Publish release

on:
  push:
    branches: [main]
    paths:
      - custom_components/strix_argentina/manifest.json
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open("custom_components/strix_argentina/manifest.json"))["version"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\n")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Expected semantic version x.y.z"
          with open("custom_components/strix_argentina/manifest.json") as f:
              manifest = json.load(f)
          assert manifest["version"] == version
          PY
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/strix_argentina/manifest.json"))["version"])')
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
      - name: Publish new version from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file CHANGELOG.md
