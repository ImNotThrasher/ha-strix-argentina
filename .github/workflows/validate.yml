name: Validate integration

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install aiohttp
      - name: Run unit tests
        run: python -m unittest discover -s tests

  ha-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated Home Assistant test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Run simulated multi-vehicle runtime test
        run: python -m pytest -q tests/test_ha_runtime.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Check syntax and critical lint errors
        run: ruff check custom_components/strix_argentina tests --select E4,E7,E9,F --ignore E501
      - name: Check Python compilation
        run: python -m compileall -q custom_components/strix_argentina tests

  hacs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
